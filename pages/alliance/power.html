<section class="page-section alliance-subpage">
  <button type="button" class="alliance-back-button secondary-button" data-page-path="alliance/members.html">← В штаб</button>
  <section class="card alliance-context-card"><div class="card-header"><div><h3 id="allianceContextName">Союз</h3><p><span id="allianceContextNickname">—</span> · <span id="allianceContextRank">—</span> · <span id="allianceContextRole">—</span></p></div></div></section>
  <div id="allianceMessage" class="alliance-message" hidden></div>

  <div id="alliancePowerSection">
    <div id="powerSectionError" class="alliance-message" data-type="error" hidden></div>

    <section id="powerSeasonSettings" class="card power-season-card" hidden>
      <div class="card-header"><div><h3>Начало сезона</h3></div></div>
      <form id="powerSeasonForm" class="power-season-form"><label><span>Начало текущего сезона</span><input id="powerSeasonStart" type="date" data-no-persist="true"></label><button type="submit">Сохранить дату</button></form>
    </section>

    <section id="powerStatisticsCard" class="card alliance-list-card power-statistics-card">
      <button id="powerCloseTable" type="button" class="alliance-fullscreen-close" aria-label="Закрыть таблицу">×</button>
      <div class="card-header"><div><h3>Статистика силы всего союза</h3><p id="powerCount">0 участников</p></div></div>
      <div class="alliance-roster-tools power-tools power-controls-row">
        <input id="powerSearch" type="search" placeholder="Поиск по нику" data-no-persist="true">
        <select id="powerSort" data-no-persist="true"><option value="power">По силе</option><option value="growth">По приросту</option><option value="nickname">По нику</option></select>
        <button id="powerBulkOpen" type="button" class="secondary-button">Ввести общей таблицей</button>
        <button id="powerExpandTable" type="button" class="secondary-button">Открыть таблицу целиком</button>
      </div>
      <div id="powerBulkControls" class="power-bulk-controls" hidden>
        <label class="power-bulk-date"><span>Дата замера для заполненных строк</span><input id="powerBulkDate" type="date" data-no-persist="true"><small class="power-bulk-hint">Кнопка «—» отмечает, что игрок не сдал силу на выбранную дату.</small></label>
        <div class="power-bulk-actions">
          <button id="powerBulkSave" type="button">Сохранить заполненные строки</button>
          <button id="powerBulkClose" type="button" class="secondary-button">Отменить общий ввод</button>
        </div>
      </div>
      <div id="powerViewOptions" class="power-view-options" aria-label="Показатели для сравнения"><strong>Показать в таблице:</strong><label class="checkbox"><input type="checkbox" data-power-column="previous" checked><span>С прошлого замера</span></label><label class="checkbox"><input type="checkbox" data-power-column="week" checked><span>За неделю</span></label><label class="checkbox"><input type="checkbox" data-power-column="month" checked><span>За месяц</span></label><label class="checkbox"><input type="checkbox" data-power-column="season" checked><span>За сезон</span></label><label class="checkbox"><input type="checkbox" data-power-column="percent" checked><span>Прирост, %</span></label></div>
      <div class="alliance-table-wrap power-table-wrap" data-horizontal-scroll><table id="powerTable" class="alliance-table power-table"><thead id="powerTableHead"></thead><tbody id="powerTableBody"></tbody></table></div>
      <div id="participantPowerSummary" class="power-summary" hidden></div>
      <div id="powerEmptyState" class="alliance-empty-state">Пока нет ни одного замера.</div>
    </section>
  </div>
</section>
