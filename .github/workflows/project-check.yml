name: Project check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: project-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/critical-lifecycle-calculator-sync-batch-8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply coordinated patch
        run: python scripts/apply-critical-lifecycle-batch-8.py

      - name: Check JavaScript and assets
        run: npm run check 2> project-check-errors.txt

      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js
          git commit -m "Исправить жизненный цикл страниц и таймер сезона"
          git push origin HEAD:fix/critical-lifecycle-calculator-sync-batch-8

      - name: Upload check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-errors
          path: project-check-errors.txt
          if-no-files-found: ignore
