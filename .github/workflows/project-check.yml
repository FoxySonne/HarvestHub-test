name: Project check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: project-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/critical-roles-vs-reservoir-batch-7

      - name: Diagnose batch 7 client package
        run: |
          set +e
          mkdir -p tmp
          wc -c tmp/batch7-client.part* > tmp/batch7-debug.txt 2>&1
          cat tmp/batch7-client.part* | base64 -d > /tmp/batch7-client.tar.gz 2>> tmp/batch7-debug.txt
          echo "decoded_size=$(wc -c < /tmp/batch7-client.tar.gz)" >> tmp/batch7-debug.txt
          gzip -t /tmp/batch7-client.tar.gz >> tmp/batch7-debug.txt 2>&1
          echo "gzip_status=$?" >> tmp/batch7-debug.txt
          tar -tzf /tmp/batch7-client.tar.gz >> tmp/batch7-debug.txt 2>&1
          echo "tar_status=$?" >> tmp/batch7-debug.txt

      - name: Commit diagnostics
        run: |
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/batch7-debug.txt
          git commit -m "Добавить диагностику клиентского пакета"
          git push origin HEAD:fix/critical-roles-vs-reservoir-batch-7
