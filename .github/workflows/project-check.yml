name: Project check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and assets
        run: npm run check 2> project-check-errors.txt

      - name: Upload check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-errors
          path: project-check-errors.txt
          if-no-files-found: ignore

      - name: Prepare guest access source snapshot
        run: |
          mkdir -p guest-source/js/alliance guest-source/js/pages guest-source/pages/alliance guest-source/supabase
          cp js/alliance/config.js guest-source/js/alliance/
          cp js/alliance/api.js guest-source/js/alliance/
          cp js/alliance/page-context.js guest-source/js/alliance/
          cp js/pages/alliance-hub.js guest-source/js/pages/
          cp js/pages/alliance-roster.js guest-source/js/pages/
          cp js/pages/alliance-reservoir-layout.js guest-source/js/pages/
          cp pages/alliance/members.html guest-source/pages/alliance/
          cp supabase/rpc-manifest.json guest-source/supabase/

      - name: Upload guest access source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: guest-access-source-snapshot
          path: guest-source
