name: Fix sync refresh visits

on:
  push:
    branches: [fix/critical-profile-sync-batch-5]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-profile-sync-batch-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch technical refreshes
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('js/sync/calculator-sync.js')
          source = path.read_text()
          source = source.replace(
            'await window.loadPage("calculator/turbo-vs.html");',
            'await window.loadPage("calculator/turbo-vs.html", { skipCurrentSave: true, trackVisit: false });'
          )
          source = source.replace(
            'await window.loadPage(currentPage);',
            'await window.loadPage(currentPage, { skipCurrentSave: true, trackVisit: false });'
          )
          path.write_text(source)
          PY
      - name: Check project
        run: npm run check
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js/sync/calculator-sync.js
          git commit -m "Не считать обновление синхронизации посещением"
          git push origin HEAD:fix/critical-profile-sync-batch-5
