name: Apply batch 7 client

on:
  push:
    branches: [fix/critical-roles-vs-reservoir-batch-7]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-roles-vs-reservoir-batch-7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract client files
        env:
          CLIENT_TAR_GZ_B64: 
        run: |
          printf '%s' "$CLIENT_TAR_GZ_B64" | base64 -d | tar -xz
      - name: Update manifest and asset version
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          manifest = Path('supabase/rpc-manifest.json')
          names = json.loads(manifest.read_text())
          names.extend([
            'can_edit_alliance', 'delete_alliance_vs_result', 'save_alliance_vs_results_batch',
            'get_or_create_reservoir_week', 'save_reservoir_week_roster',
            'close_reservoir_week', 'get_reservoir_activity'
          ])
          manifest.write_text(json.dumps(sorted(set(names)), ensure_ascii=False, indent=2) + '\n')
          navigation = Path('js/core/navigation.js')
          source = navigation.read_text()
          source = source.replace('const SITE_ASSET_VERSION = "20260725-profile-sync-1";', 'const SITE_ASSET_VERSION = "20260726-critical-batch-7";')
          navigation.write_text(source)
          PY
      - name: Check project
        run: npm run check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js pages supabase/rpc-manifest.json
          git commit -m "Исправить роли массовый VS и активность резервуара"
          git push origin HEAD:fix/critical-roles-vs-reservoir-batch-7
