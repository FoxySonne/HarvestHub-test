name: Add batch 7 migration

on:
  push:
    branches: [fix/critical-roles-vs-reservoir-batch-7]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-roles-vs-reservoir-batch-7
      - name: Decode migration
        env:
          MIGRATION_GZ_B64: 
        run: |
          mkdir -p supabase/migrations
          printf '%s' "$MIGRATION_GZ_B64" | base64 -d | gzip -d > supabase/migrations/20260725230651_critical_roles_vs_reservoir_batch_7.sql
      - name: Commit migration
        run: |
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260725230651_critical_roles_vs_reservoir_batch_7.sql
          git commit -m "Добавить миграцию ролей VS и резервуара"
          git push origin HEAD:fix/critical-roles-vs-reservoir-batch-7
