name: Apply profile sync batch 5

on:
  push:
    branches: [fix/critical-profile-sync-batch-5]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/critical-profile-sync-batch-5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply coordinated patch
        run: python scripts/apply-profile-sync-batch-5.py

      - name: Check project
        run: npm run check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js index.html
          git commit -m "Исправить синхронизацию и атомарность профилей"
          git push origin HEAD:fix/critical-profile-sync-batch-5
