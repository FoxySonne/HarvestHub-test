name: Apply guest patch

on:
  push:
    branches: [fix/critical-guest-access-batch-4]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/critical-guest-access-batch-4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(source, old, new, label):
              if old in source:
                  return source.replace(old, new, 1)
              if new in source:
                  return source
              raise SystemExit(f'Expected fragment not found: {label}')

          layout = Path('js/pages/alliance-reservoir-layout.js')
          source = layout.read_text()
          changes = [
              ('import { loadAlliancePageContext, fillAllianceCompactHeader, getActiveAllianceId, canEditAlliance } from "../alliance/page-context.js?v=20260718-1";', 'import { loadAlliancePageContext, fillAllianceCompactHeader, getActiveAllianceId, canEditAlliance } from "../alliance/page-context.js?v=20260725-guest-access-1";', 'layout import'),
              ('const byId = id => document.getElementById(id);\n', '''const byId = id => document.getElementById(id);\n\nfunction escapeHtml(value) {\n  return String(value ?? "")\n    .replaceAll("&", "&amp;")\n    .replaceAll("<", "&lt;")\n    .replaceAll(">", "&gt;")\n    .replaceAll('"', "&quot;")\n    .replaceAll("'", "&#039;");\n}\n''', 'escape helper'),
              ('${state.publishedAt && playerNames.length ? `<span>Игроки: ${playerNames.join(", ")}</span>` : ""}${note ? `<span>${note}</span>` : ""}', '${state.publishedAt && playerNames.length ? `<span>Игроки: ${playerNames.map(escapeHtml).join(", ")}</span>` : ""}${note ? `<span>${escapeHtml(note)}</span>` : ""}', 'location popover'),
              ('data-player-id="${item.participant_id}"><span>${item.nickname}</span>', 'data-player-id="${escapeHtml(item.participant_id)}"><span>${escapeHtml(item.nickname)}</span>', 'player pool'),
              ('<span>${player.nickname}</span><strong>', '<span>${escapeHtml(player.nickname)}</span><strong>', 'assigned player'),
              ('<textarea data-location-note="${location.key}" rows="2" placeholder="Комментарий к локации">${state.notes.get(location.key) || ""}</textarea>', '<textarea data-location-note="${location.key}" rows="2" placeholder="Комментарий к локации">${escapeHtml(state.notes.get(location.key) || "")}</textarea>', 'location textarea'),
              ('${names.length ? names.join(", ") : "—"}</p>${note ? `<small>${note}</small>` : ""}', '${names.length ? names.map(escapeHtml).join(", ") : "—"}</p>${note ? `<small>${escapeHtml(note)}</small>` : ""}', 'published layout'),
              ('box.innerHTML = warnings.map(text => `<span>${text}</span>`).join("");', 'box.innerHTML = warnings.map(text => `<span>${escapeHtml(text)}</span>`).join("");', 'warnings'),
              ('data-picker-player="${item.participant_id}"><span>${item.nickname}${item.assignment === "reserve" ? " · резерв" : ""}</span>', 'data-picker-player="${escapeHtml(item.participant_id)}"><span>${escapeHtml(item.nickname)}${item.assignment === "reserve" ? " · резерв" : ""}</span>', 'picker'),
              ('popover.innerHTML = `<strong>Водосборники</strong><span>${state.notes.get(collectors.dataset.collector) || "Комментарий не добавлен"}</span>`;', 'popover.innerHTML = `<strong>Водосборники</strong><span>${escapeHtml(state.notes.get(collectors.dataset.collector) || "Комментарий не добавлен")}</span>`;', 'collector note')
          ]
          for old, new, label in changes:
              source = replace_once(source, old, new, label)

          old_load = '''async function load() {\n  state.context = await loadAlliancePageContext(state.client);\n  fillAllianceCompactHeader(state.context);\n  state.canEdit = canEditAlliance(state.context);\n  const allianceId = getActiveAllianceId();\n  const weeksResult = await fetchReservoirWeeks(state.client, allianceId);\n'''
          new_load = '''function loadGuestLayout(layoutData) {\n  if (!layoutData?.week?.id || !layoutData.published_at) {\n    throw new Error("Расстановка резервуара ещё не опубликована.");\n  }\n  state.week = layoutData.week;\n  state.canEdit = false;\n  state.roster = Array.isArray(layoutData.roster) ? layoutData.roster : [];\n  state.publishedAt = layoutData.published_at;\n  state.generalComment = layoutData.general_comment || "";\n  byId("reservoirLayoutWeek").textContent = `${formatDate(state.week.event_date)} · ${String(state.week.event_hour_msk).padStart(2, "0")} МСК`;\n  byId("reservoirGeneralComment").value = state.generalComment;\n  (layoutData.assignments || []).forEach(item => {\n    const ids = state.assignments.get(item.location_key) || [];\n    ids.push(item.participant_id);\n    state.assignments.set(item.location_key, ids);\n  });\n  (layoutData.notes || []).forEach(item => state.notes.set(item.location_key, item.comment));\n  byId("reservoirLayoutEditor").hidden = true;\n  renderAll();\n}\n\nasync function load() {\n  state.context = await loadAlliancePageContext(state.client);\n  fillAllianceCompactHeader(state.context);\n  state.canEdit = canEditAlliance(state.context);\n  if (state.context.isGuest) {\n    loadGuestLayout(state.context.guestData?.published_layout);\n    return;\n  }\n\n  const allianceId = getActiveAllianceId();\n  const weeksResult = await fetchReservoirWeeks(state.client, allianceId);\n'''
          source = replace_once(source, old_load, new_load, 'guest load branch')
          layout.write_text(source)

          members = Path('pages/alliance/members.html')
          source = members.read_text()
          source = source.replace('Выбери подключённый союз или введи пригласительный код.', 'Выбери подключённый союз или открой гостевой просмотр по коду.')
          source = source.replace('Чтобы подключить или создать союзный штаб, войди в HarvestHub.', 'Чтобы создать штаб и получить права участника, войди в HarvestHub.')
          members.write_text(source)

          manifest = Path('supabase/rpc-manifest.json')
          rpc = json.loads(manifest.read_text())
          manifest.write_text(json.dumps([name for name in rpc if name != 'join_alliance_by_code'], ensure_ascii=False, indent=2) + '\n')

          migration = Path('supabase/migrations/20260725202530_critical_guest_access_payload.sql')
          if not migration.exists():
              migration.write_text('''-- Critical guest access batch 4: safe code-based view without persistent data exposure.\n\ncreate or replace function public.open_alliance_by_code(access_code text)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $$\ndeclare\n  target_alliance_id uuid;\n  target_alliance_name text;\n  target_state_number text;\n  participant_list jsonb;\n  published_layout jsonb;\nbegin\n  select a.id, a.name, a.state_number\n  into target_alliance_id, target_alliance_name, target_state_number\n  from public.alliances a\n  where a.invite_code = upper(trim(access_code))\n  limit 1;\n  if target_alliance_id is null then return null; end if;\n  select coalesce(jsonb_agg(jsonb_build_object('id', p.id, 'nickname', p.nickname, 'rank_name', p.rank_name) order by p.nickname), '[]'::jsonb)\n  into participant_list\n  from public.participants p\n  where p.alliance_id = target_alliance_id and p.member_status <> 'left';\n  select jsonb_build_object(\n    'week', jsonb_build_object('id', latest.id, 'event_date', latest.event_date, 'event_hour_msk', latest.event_hour_msk),\n    'published_at', latest.published_at,\n    'general_comment', coalesce(latest.general_comment, ''),\n    'roster', (select coalesce(jsonb_agg(jsonb_build_object('participant_id', p.id, 'nickname', p.nickname, 'assignment', rp.assignment) order by case rp.assignment when 'main' then 0 else 1 end, p.nickname), '[]'::jsonb) from public.alliance_reservoir_participants rp join public.participants p on p.id = rp.participant_id where rp.week_id = latest.id and rp.assignment in ('main', 'reserve') and p.alliance_id = target_alliance_id and p.member_status <> 'left'),\n    'assignments', (select coalesce(jsonb_agg(jsonb_build_object('location_key', a.location_key, 'participant_id', a.participant_id, 'sort_order', a.sort_order) order by a.location_key, a.sort_order), '[]'::jsonb) from public.alliance_reservoir_assignments a join public.participants p on p.id = a.participant_id join public.alliance_reservoir_participants rp on rp.week_id = a.week_id and rp.participant_id = a.participant_id and rp.assignment in ('main', 'reserve') where a.week_id = latest.id and p.alliance_id = target_alliance_id and p.member_status <> 'left'),\n    'notes', (select coalesce(jsonb_agg(jsonb_build_object('location_key', n.location_key, 'comment', n.comment) order by n.location_key), '[]'::jsonb) from public.alliance_reservoir_location_notes n where n.week_id = latest.id)\n  ) into published_layout\n  from (select w.id, w.event_date, w.event_hour_msk, l.general_comment, l.published_at from public.alliance_reservoir_weeks w join public.alliance_reservoir_layouts l on l.week_id = w.id where w.alliance_id = target_alliance_id and l.published_at is not null order by w.event_date desc, l.published_at desc limit 1) latest;\n  return jsonb_build_object('alliance', jsonb_build_object('id', target_alliance_id, 'name', target_alliance_name, 'state_number', target_state_number), 'participants', participant_list, 'published_layout', published_layout);\nend;\n$$;\n\nrevoke execute on function public.open_alliance_by_code(text) from public;\ngrant execute on function public.open_alliance_by_code(text) to anon, authenticated;\n\ndelete from public.alliance_members m\nwhere m.role = 'viewer'\n  and not exists (select 1 from public.participants p where p.alliance_id = m.alliance_id and p.linked_user_id = m.user_id and p.member_status <> 'left');\n''')
          PY

      - name: Check project
        run: npm run check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js/pages/alliance-reservoir-layout.js pages/alliance/members.html supabase/rpc-manifest.json supabase/migrations/20260725202530_critical_guest_access_payload.sql
          git commit -m "Завершить гостевой просмотр по коду"
          git push origin HEAD:fix/critical-guest-access-batch-4
