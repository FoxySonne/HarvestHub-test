name: Use initial profile guard

on:
  push:
    branches: [fix/critical-profile-sync-batch-5]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-profile-sync-batch-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use guarded initial profile RPC
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('js/account/game-profile-manager.js')
          source = path.read_text()
          old = 'return callProfileRpc("create_and_activate_game_profile", {'
          new = 'return callProfileRpc("ensure_initial_game_profile", {'
          if new not in source:
            if old not in source: raise SystemExit('Initial profile call not found')
            source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - name: Check project
        run: npm run check
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js/account/game-profile-manager.js
          git commit -m "Не создавать два первых профиля одновременно"
          git push origin HEAD:fix/critical-profile-sync-batch-5
