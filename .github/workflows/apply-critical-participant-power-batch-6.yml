name: Apply critical participant power batch 6

on:
  push:
    branches: [fix/critical-participant-power-batch-6]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-participant-power-batch-6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply coordinated client patch
        run: python scripts/apply-critical-participant-power-batch-6.py
      - name: Update RPC manifest
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          path = Path('supabase/rpc-manifest.json')
          names = json.loads(path.read_text())
          if 'save_alliance_squad_power_batch' not in names:
              names.append('save_alliance_squad_power_batch')
          path.write_text(json.dumps(sorted(names), ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Check project
        run: npm run check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HarvestHub automation"
          git config user.email "actions@users.noreply.github.com"
          git add js pages supabase/rpc-manifest.json
          git commit -m "Исправить архив участников и массовый ввод силы"
          git push origin HEAD:fix/critical-participant-power-batch-6
